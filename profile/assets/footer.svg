<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="170" viewBox="0 0 1280 170" role="img" aria-labelledby="t">
  <title id="t">I Plus T Solution — Transforming Ideas Into Digital Reality</title>
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0BBF64"/>
      <stop offset="0.5" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#26F2D6"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#86EFAC"/>
      <stop offset="0.5" stop-color="#F0FDF4"/>
      <stop offset="1" stop-color="#A7FFF0"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    .wave { animation: drift 9s ease-in-out infinite alternate; }
