  <text class="sans" x="640" y="64" text-anchor="middle" font-size="30" font-weight="800" fill="url(#txt)">Transforming Ideas Into Digital Reality</text>
  <text class="mono" x="640" y="94" text-anchor="middle" font-size="13" letter-spacing="2" fill="#9BBFAA">I PLUS T SOLUTION · GURUGRAM, INDIA · WORLDWIDE</text>
